spring:
  config:
    import: optional:file:.env[.properties]  # 스프링은 .env를 자동으로 읽지 않는다. 읽을 수 있도록 설정 추가.
  mustache:
    servlet:
      expose-session-attributes: false   # 머스태치 파일에서 세션에 담을 값을 바로 사용 가능.
  servlet:
    multipart:
      max-file-size: 10MB   # 파일 하나의 최대 크기
      max-request-size: 11MB  # 요청 전체(파일 + 입력값)의 크기
  profiles:
    active: local

#초기 파라미터 설정.
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
